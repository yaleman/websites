version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: saturday
      time: "02:00"
      timezone: "Australia/Brisbane"
updates:
- package-ecosystem: cargo
  directory: /
  patterns:
  - "*"
  multi-ecosystem-group: dependencies
- package-ecosystem: npm
  directory: /
  patterns:
  - "*"
  multi-ecosystem-group: dependencies
- package-ecosystem: github-actions
  directory: /
  patterns:
  - "*"
  multi-ecosystem-group: dependencies
