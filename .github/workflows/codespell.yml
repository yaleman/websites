---
name: Spell Check

"on":
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install and run codespell
        run: |
          python -m pip install --upgrade pip codespell
          codespell \
            --check-filenames \
            --skip="./Cargo.lock,./docs/book,./docs/*.js,./node_modules,./target,./admin-ui-assets,./assets/admin/openapi.ts,./openapi.json,./pnpm-lock.yaml"
