---
name: Dependabot pnpm self-heal

"on": pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  sync_pnpm_overrides:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check whether pnpm-lock.yaml changed
        id: changed-files
        run: |
          git fetch origin "${GITHUB_BASE_REF}"
          if git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -Fxq "pnpm-lock.yaml"; then
            echo "lockfile_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "lockfile_changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Sync pnpm overrides into package.json
        if: steps.changed-files.outputs.lockfile_changed == 'true'
        run: node scripts/sync-pnpm-overrides.mjs .

      - name: Install frontend dependencies without package scripts
        if: steps.changed-files.outputs.lockfile_changed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Commit self-heal changes
        if: steps.changed-files.outputs.lockfile_changed == 'true'
        run: |
          if git diff --quiet -- package.json; then
            echo "No package.json changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Sync pnpm overrides"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
