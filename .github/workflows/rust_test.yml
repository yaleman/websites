---
name: CI Checks

"on":
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair_pnpm_lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pushed_fix: ${{ steps.commit-lockfile-repair.outputs.pushed_fix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Check whether this run should repair a Dependabot pnpm PR first
        id: changed-files
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          should_repair=false
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "${PR_AUTHOR}" = "dependabot[bot]" ]; then
            git fetch origin "${GITHUB_BASE_REF}"
            if git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -Fxq "pnpm-lock.yaml"; then
              should_repair=true
            fi
          fi

          echo "should_repair=${should_repair}" >> "${GITHUB_OUTPUT}"

      - name: Set up Rust toolchain
        if: steps.changed-files.outputs.should_repair == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up pnpm
        if: steps.changed-files.outputs.should_repair == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Set up Node.js
        if: steps.changed-files.outputs.should_repair == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Repair package.json pnpm overrides from the updated lockfile
        if: steps.changed-files.outputs.should_repair == 'true'
        run: cargo run --quiet --manifest-path tools/repair-pnpm-lockfile/Cargo.toml -- .

      - name: Install frontend dependencies without package scripts
        if: steps.changed-files.outputs.should_repair == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Regenerate admin assets for lockfile-driven frontend updates
        if: steps.changed-files.outputs.should_repair == 'true'
        run: pnpm run build:admin

      - name: Commit lockfile repair
        id: commit-lockfile-repair
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          pushed_fix=false
          if [ "${{ steps.changed-files.outputs.should_repair }}" = "true" ] && ! git diff --quiet -- package.json admin-ui-assets; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json admin-ui-assets
            git commit -m "Repair pnpm frontend outputs"
            git push origin "HEAD:${HEAD_REF}"
            pushed_fix=true
          fi

          echo "pushed_fix=${pushed_fix}" >> "${GITHUB_OUTPUT}"

  # Keep the legacy rust_test job name because branch protection requires it,
  # even though this job now covers mixed Rust, frontend, and generated-artifact checks.
  rust_test:
    needs:
      - repair_pnpm_lockfile
    if: ${{ needs.repair_pnpm_lockfile.outputs.pushed_fix != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mise-action@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Generate self-signed TLS certs
        run: |
          python -m pip install --upgrade pip cryptography
          cert_dir="${RUNNER_TEMP}/tls"
          mkdir -p "${cert_dir}"
          cert_path="${cert_dir}/tls.crt"
          key_path="${cert_dir}/tls.key"

          python - <<'PY'
          import ipaddress
          import os
          from datetime import datetime, timedelta, timezone

          from cryptography import x509
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.x509.oid import NameOID

          cert_path = os.environ["CERT_PATH"]
          key_path = os.environ["KEY_PATH"]

          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          subject = issuer = x509.Name(
              [x509.NameAttribute(NameOID.COMMON_NAME, "127.0.0.1")]
          )
          san = x509.SubjectAlternativeName(
              [
                  x509.IPAddress(ipaddress.ip_address("127.0.0.1")),
                  x509.DNSName("localhost"),
              ]
          )
          now = datetime.now(timezone.utc)
          cert = (
              x509.CertificateBuilder()
              .subject_name(subject)
              .issuer_name(issuer)
              .public_key(key.public_key())
              .serial_number(x509.random_serial_number())
              .not_valid_before(now - timedelta(minutes=5))
              .not_valid_after(now + timedelta(days=7))
              .add_extension(san, critical=False)
              .sign(key, hashes.SHA256())
          )

          with open(key_path, "wb") as key_file:
              key_file.write(
                  key.private_bytes(
                      encoding=serialization.Encoding.PEM,
                      format=serialization.PrivateFormat.TraditionalOpenSSL,
                      encryption_algorithm=serialization.NoEncryption(),
                  )
              )

          with open(cert_path, "wb") as cert_file:
              cert_file.write(cert.public_bytes(serialization.Encoding.PEM))
          PY
        env:
          CERT_PATH: ${{ runner.temp }}/tls/tls.crt
          KEY_PATH: ${{ runner.temp }}/tls/tls.key

      - name: Export TLS env vars
        run: |
          echo "WEBSITES_TLS_CERT_PATH=${RUNNER_TEMP}/tls/tls.crt" >> "${GITHUB_ENV}"
          echo "WEBSITES_TLS_KEY_PATH=${RUNNER_TEMP}/tls/tls.key" >> "${GITHUB_ENV}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browser dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --all --quiet --locked

      - name: Regenerate OpenAPI schema
        run: cargo run -- dump-open-api-spec ./openapi.json

      - name: Regenerate OpenAPI TypeScript types
        run: |
          pnpm exec openapi-typescript \
            ./openapi.json \
            --dedupe-enums \
            --enum \
            --alphabetize \
            --make-paths-enum \
            --output assets/admin/openapi.ts

      - name: Build admin assets
        run: pnpm run build:admin

      - name: Install Python client test package
        run: python -m pip install --upgrade pip uv

      - name: Build Rust binaries for Python client tests
        run: cargo build --quiet --bin websites --bin session_seed

      - name: Run Python generated-client tests
        run: cd ./python_api_client && uv run pytest

      - name: Verify generated artifacts are committed
        run: git diff --exit-code -- openapi.json assets/admin/openapi.ts admin-ui-assets

      - name: Check frontend types
        run: pnpm exec tsc --noEmit

      - name: Run end-to-end tests
        run: pnpm exec playwright test

  build_container:
    needs:
      - rust_test
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      platforms: linux/amd64,linux/arm64
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      distribute: true
      setup-qemu: false
      cache: true
      cache-mode: max
      cache-scope: websites-container
      context: .
      file: ./Dockerfile
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=sha,prefix=sha-
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
