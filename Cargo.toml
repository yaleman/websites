[package]
name = "websites"
version = "0.1.0"
edition = "2024"

default-run = "websites"

[lib]

[dependencies]
anyhow = "1.0.102"
askama = "0.15.4"
askama_web = { version = "0.15.2", features = ["axum-0.8", "tracing-0.1"] }
async-trait = "0.1.89"
aws-config = "1.8.16"
aws-credential-types = "1.2.14"
aws-sdk-s3 = "1.131.0"
aws-types = "1.3.15"
axum = { version = "0.8.8", features = ["multipart", "macros"] }
axum-server = { version = "0.8.0", features = ["tokio-rustls", "tls-rustls"] }
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "env"] }
compact_jwt = "0.5.6"
gix = { version = "0.83.0", default-features = false, features = [
    "blocking-http-transport-reqwest",
    "blocking-http-transport-reqwest-rust-tls",
    "blocking-network-client",
    "sha1",
    "worktree-mutation",
    "worktree-stream",
] }
gix-transport = { version = "0.57.0", default-features = false, features = [
    "blocking-client",
] }
glob = "0.3.3"
html-escape = "0.2.13"
image = "0.25.10"
markdown = "1.0.0"
mime_guess = "2.0.5"
openidconnect = { version = "4.0.1", features = ["reqwest"] }
quick-xml = "0.39.2"
rand = "0.10.1"
regex = "1.12.3"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "multipart",
] }
russh = { version = "0.56.0", default-features = false, features = [
    "aws-lc-rs",
    "flate2",
] }
rustls = "0.23.40"
sea-orm = { version = "1.1.20", features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
    "with-chrono",
    "with-json",
    "with-uuid",
], default-features = false }
sea-orm-migration = { version = "1.1.20", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
similar = "3.1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite"] }
tempfile = "3.27.0"
tera = "1.20.1"
thiserror = "2.0.18"
tokio = { version = "1.51.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "io-util",
    "net",
    "fs",
], default-features = false }
tokio-util = { version = "0.7.18", default-features = false, features = [
    "io",
    "io-util",
] }
tower-http = { version = "0.6.8", features = ["fs"] }
tower-sessions = "0.15.0"
# TODO: remove this vendored tower-sessions-sqlx-store dependency once the upstream dependencies are updated.
tower-sessions-sqlx-store = { path = "vendor/tower-sessions-sqlx-store", features = [
    "sqlite",
] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.23", features = [
    "json",
    "serde",
    "tracing",
    "env-filter",
] }
url = "2.5.8"
utoipa = { version = "5.4.0", features = [
    "url",
    "uuid",
    "time",
    "chrono",
    "axum_extras",
] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
uuid = { version = "1.23.1", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = "0.5.2"
