[package]
name = "websites"
version = "0.1.0"
edition = "2024"

default-run = "websites"

[lib]

[dependencies]
anyhow = "1.0.105"
askama = "0.16.0"
askama_web = { version = "0.16.0", features = ["axum-0.8", "tracing-0.1"] }
async-trait = "0.1.89"
aws-config = "1.8.18"
aws-credential-types = "1.2.14"
aws-sdk-s3 = "1.135.0"
aws-types = "=1.7.0"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
axum-server = { version = "0.9.2", features = ["tokio-rustls", "tls-rustls"] }
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive", "env"] }
compact_jwt = "0.6.0"
gix = { version = "0.91.0", default-features = false, features = [
    "blocking-http-transport-reqwest",
    "blocking-http-transport-reqwest-rust-tls",
    "blocking-network-client",
    "sha1",
    "worktree-mutation",
    "worktree-stream",
] }
gix-transport = { version = "0.63.0", default-features = false, features = [
    "blocking-client",
] }
glob = "0.3.3"
html-escape = "0.3.1"
image = "0.25.10"
markdown = "1.0.0"
mime_guess = "2.0.5"
openidconnect = { version = "4.0.1", features = ["reqwest"] }
quick-xml = "0.42.0"
rand = "0.10.4"
regex = "1.13.2"
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls",
    "json",
    "multipart",
] }
russh = { version = "0.65.4", default-features = false, features = [
    "aws-lc-rs",
    "flate2",
] }
rustls = "0.23.46"
sea-orm = { version = "2.0.4", features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
    "with-chrono",
    "with-json",
    "with-uuid",
], default-features = false }
sea-orm-migration = { version = "2.0.4", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
sqlx = { version = "0.9.1", features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "sqlite",
] }
tempfile = "3.27.0"
tera = "2.4.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "io-util",
    "net",
    "fs",
], default-features = false }
tokio-util = { version = "0.7.20", default-features = false, features = [
    "io",
    "io-util",
] }
tower-http = { version = "0.7.1", features = ["fs"] }
tower-sessions = "0.15.0"
tower-sessions-sqlx-store = { version = "0.16.0", features = ["sqlite"] }

tracing = { version = "0.1.44", features = ["log"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = [
    "json",
    "serde",
    "tracing",
    "env-filter",
] }
url = "2.5.9"
utoipa = { version = "6.0.0", features = [
    "url",
    "uuid",
    "time",
    "chrono",
    "axum_extras",
] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
uuid = { version = "1.29.3", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = "0.5.3"
