[tools]
"github:xd009642/tarpaulin" = "latest"
pnpm = "latest"
python = "3.13"
semgrep = "latest"

[tasks.check]
depends = [
    "rust_clippy",
    "rust_fmt",
    "rust_test",
    "frontend_check",
    "python_client_test",
    "frontend_e2e",
]


[tasks.rust_clippy]
run = "cargo clippy --all-targets --all-features  --quiet -- -D warnings"

[tasks.rust_fmt]
run = "cargo fmt --all --"

[tasks.rust_test]
run = "cargo test --all --quiet"

[tasks.frontend_install]
run = "pnpm install --frozen-lockfile --ignore-scripts"

[tasks.frontend_build]
depends = ["frontend_install", "openapi-to-ts"]
run = "pnpm run build:admin"
depends_post = ["copy-admin-images"]

[tasks.frontend_check]
depends = ["frontend_install", "frontend_build"]
run = "pnpm exec tsc --noEmit"

[tasks.frontend_e2e]
depends = ["frontend_build"]
run = "pnpm exec playwright test"


[tasks.start]
depends = ["frontend_build"]
run = "cargo run"

[tasks.coverage]
run = "cargo tarpaulin --engine llvm --lib --out Html --exclude-files src/cli.rs"

[tasks.docs_build]
run = "cd docs && mdbook build"

[tasks.docs_serve]
run = "cd docs && mdbook serve"

[tasks.coveralls]
run = [
    "cargo tarpaulin --coveralls ${COVERALLS_REPO_TOKEN} --exclude-files src/main.rs --exclude-files src/migration/*.rs --exclude-files src/cli.rs --exclude-files src/bin/session_seed.rs",
    "echo \"Coveralls repo information is at https://coveralls.io/github/yaleman/websites\"",
]

[tasks.openapi-dump]
run = "cargo run -- dump-open-api-spec ./openapi.json"

[tasks.openapi-to-ts]
description = "run openapi-to-ts to generate typescript types from the OpenAPI spec"
depends = ["openapi-dump"]
run = ['''
pnpm exec openapi-typescript \
   ./openapi.json --dedupe-enums --enum \
   --alphabetize --make-paths-enum \
   --output assets/admin/openapi.ts
''']

[tasks.docker_build]
description = "build the Docker image for the application"
run = "docker build -t websites:latest ."

[tasks.python_ruff]
depends = ["python_gen"]
run = "cd python_api_client && uv run ruff check"

[tasks.python_ty]
depends = ["python_gen"]
run = "cd python_api_client && uv run ty check"

[tasks.python_checks]
description = "run all checks for the Python client"
depends = ["python_client_test", "python_ruff", "python_ty"]

[tasks.python_gen]
description = "generate the Python client code from the OpenAPI spec"
depends = ["openapi-dump"]
run = [
    "uv run openapi-python-client generate --path openapi.json --output-path python_api_client --overwrite --meta uv --config python_api_client/openapi_config.yml",
    "cd python_api_client && uv sync",
]

[tasks.python_client_test]
depends = ["frontend_build", "python_gen"]
run = [
    "cargo build --quiet --bin websites --bin session_seed",
    "cd python_api_client && uv run pytest",
]

[tasks.python_coverage]
depends = ["frontend_build", "python_gen"]
run = "cd python_api_client && uv run --with pytest-cov pytest --cov=websites --cov-report=term-missing"

[tasks.docker_run]
run = '''
docker run --rm -it \
    --pull always \
    --init \
    --mount "type=bind,src=$(pwd)/database.sqlite,target=/data/websites.sqlite" \
    --mount "type=bind,src=${WEBSITES_TLS_CERT_PATH},target=/certs/tls.crt" \
    --mount "type=bind,src=${WEBSITES_TLS_KEY_PATH},target=/certs/tls.key" \
    -p 9000:9000 \
    -e "WEBSITES_FRONTEND_URL=${WEBSITES_FRONTEND_URL}" \
    -e "WEBSITES_OIDC_CLIENT_ID=${WEBSITES_OIDC_CLIENT_ID}" \
    -e "WEBSITES_OIDC_DISCOVERY_URL=${WEBSITES_OIDC_DISCOVERY_URL}" \
    'ghcr.io/yaleman/websites:latest'
'''


[tasks.favicon_inner]
description = "Export one favicon size from assets/images/favicon.svg"
usage = '''
arg "<source>" help="svg filename prefix without the .svg extension, e.g. 'favicon' or 'favicon2'"
arg "<size>" help="PNG size in px"
'''
run = '''
set -euo pipefail
source="${usage_source?missing source}"
size="${usage_size?missing size}"

inkscape assets/images/${source}.svg \
  --export-type=png \
  --export-filename="assets/images/${source}-${size}.png" \
  --export-width="${size}"
'''


[tasks.favicon-192]
description = "Generate 192x192 favicon"
run = ["mise run favicon_inner editor 192"]

[tasks.favicon-128]
description = "Generate 128 favicon"
run = ["mise run favicon_inner editor 128"]

[tasks.favicon-512]
description = "Generate 512x512 favicon"
run = ["mise run favicon_inner editor 512"]


[tasks.favicon]
description = "Generate favicons in multiple sizes for better compatibility with different browsers and platforms"
depends = ["favicon-128", "favicon-192", "favicon-512"]
run = ["cp assets/images/editor-128.png assets/images/editor.png"]


[tasks.copy-admin-images]
description = "Copy admin images to the output directory for the frontend build"
run = [
    "mkdir -p admin-ui-assets/images",
    "rsync -av assets/images/* admin-ui-assets/images/",
]
