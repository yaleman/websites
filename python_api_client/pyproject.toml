[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "websites-api-client-tests"
version = "0.1.0"
description = "Generated Python client tests for the websites API"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=44,<46",
    "httpx>=0.27,<1",
    "openapi-python-client>=0.24,<1",
    "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["websites_api_client_tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
