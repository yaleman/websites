
[project]
name = "websites-api-client-tests"
version = "0.0.1"
description = "Generated Python client tests for the websites API"
requires-python = ">=3.12"
dependencies = ["cryptography", "httpx", "openapi-python-client"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["websites_api_client_tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.4.2", "ruff>=0.13.3", "ty>=0.0.23"]
