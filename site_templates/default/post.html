<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>{{site_title}}</h1>
      <a href="/">Home</a>
    </header>
    <main>
      <article>
        <header>
          <h2>{{title}}</h2>
          {% if published_at %}
          <p class="meta">Published {{ published_at }}</p>
          {% endif %}
          {% if tag_links != "" %}
          <p class="meta">Tags: {{ tag_links }}</p>
          {% endif %}
        </header>
        <section class="content">{{content}}</section>
      </article>
    </main>
  </body>
</html>
