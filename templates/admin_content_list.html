{% extends "base_template.html" %}
{% block body %}
{% if !content_items.is_empty() %}
<table>
  <thead>
    <tr>
      <th>Title</th>
      <th>Type</th>
      <th>Created</th>
    </tr>
  </thead>
  <tbody>
    {% for item in content_items %}
    <tr>
      <td><a href="/admin/site/{{ site_id }}/content/{{ item.id }}/source">{{ item.title }}</a></td>
      <td>{{ item.page_type }}</td>
      <td>{{ item.created_at }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}

{% endblock %}
