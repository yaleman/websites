{% extends "base_template.html" %}
{% block body %}
{% if !rows.is_empty() %}
<table>
  <thead>
    <tr>
      <th>Title</th>
      <th>Value</th>
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
    <tr>
      <td>{{ row.label }}</td>
      <td>{{ row.value }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}

<form method="get" action>
  <label for="q">Search Query</label>
  <input id="q" name="q" value="{{ query }}" />

  <button type="submit">Search</button>
</form>

{% endblock %}
