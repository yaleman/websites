{% extends "base_template.html" %}
{% block body %}
<p class="inline-body">
  Upload a site export JSON file to create a new site record with its related database content.
</p>

<form method="post" action enctype="multipart/form-data" class="stack-form">
  <div class="form-field">
    <label for="file">Select File</label>
    <input id="file" name="file" type="file" accept="application/json,.json" required />
  </div>

  <div class="form-actions">
    <button type="submit">Import site</button>
  </div>
</form>
{% endblock %}
