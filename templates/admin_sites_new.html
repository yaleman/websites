{% extends "base_template.html" %}
{% block body %}

<section class="surface max-w-2xl p-4 md:p-6">
  <form method="post" action="/admin/sites/new" class="stack-form">
    <div class="form-field">
      <label for="short_name">Short Name</label>
      <input id="short_name" name="short_name" required />
    </div>

    <div class="form-field">
      <label for="full_title">Full Title</label>
      <input id="full_title" name="full_title" required />
    </div>

    <div class="form-field">
      <label for="template_name">Template</label>
      <select id="template_name" name="template_name" required>
        {% for template in templates %}
        <option value="{{ template }}" {% if template == "default" %}selected{% endif %}>{{ template }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn">Create site</button>
  </form>
</section>

{% endblock %}
