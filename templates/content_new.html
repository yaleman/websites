{% extends "base_template.html" %}
{% block body %}
<form method="post" action class="editor-form">
  <div class="form-grid">
    <div class="form-field">
      <label for="title">Title</label>
      <input id="title" name="title" type="text" required />
    </div>
    <div class="form-field">
      <label for="slug">Slug</label>
      <input id="slug" name="slug" type="text" required />
    </div>
    <div class="form-field">
      <label for="page_type">Page Type</label>
      <select id="page_type" name="page_type" required>
        <option value="post">Post</option>
        <option value="page">Page</option>
      </select>
    </div>
  </div>

  <div class="editor-toolbar" data-editor-toolbar>
    <div class="editor-toolbar__group">
      <button type="button" class="editor-button" data-command="bold">Bold</button>
      <button type="button" class="editor-button" data-command="italic">Italic</button>
      <button type="button" class="editor-button" data-command="code">Code</button>
      <button type="button" class="editor-button" data-command="link">Link</button>
      <button type="button" class="editor-button" data-command="image">Image</button>
    </div>
    <div class="editor-toolbar__group">
      <button type="button" class="editor-button" data-command="h2">H2</button>
      <button type="button" class="editor-button" data-command="h3">H3</button>
    </div>
    <div class="editor-toolbar__group">
      <button type="button" class="editor-button" data-command="ul">Bullets</button>
      <button type="button" class="editor-button" data-command="ol">Numbered</button>
      <button type="button" class="editor-button" data-command="quote">Quote</button>
    </div>
    <div class="editor-toolbar__group">
      <button type="button" class="editor-button" data-command="preview" aria-pressed="false">
        Preview
      </button>
    </div>
  </div>
  <div class="editor-image-tools">
    <div class="form-field">
      <label for="image_url">Image URL</label>
      <input id="image_url" type="url" placeholder="https://example.com/image.png" />
    </div>
    <div class="form-field">
      <label for="image_alt">Alt text</label>
      <input id="image_alt" type="text" placeholder="Describe the image" />
    </div>
  </div>
  <div id="editor" class="editor-shell"></div>
  <textarea id="page_content" name="page_content" rows="14" class="editor-source"></textarea>
  <section class="editor-preview" data-editor-preview hidden>
    <div class="editor-preview__header">
      <h2>Preview</h2>
    </div>
    <div class="editor-preview__body" data-editor-preview-body></div>
  </section>

  <label class="inline-checkbox">
    <input id="draft" name="draft" type="checkbox" value="true" />
    Save as draft
  </label>

  <label for="tags">Tags</label>
  {% if tags.is_empty() %}
  <p class="inline-body">No tags defined yet.</p>
  {% else %}
  <select id="tags" name="tags" multiple size="6">
    {% for tag in tags %}
    <option value="{{ tag.name }}">{{ tag.name }}</option>
    {% endfor %}
  </select>
  <p class="inline-body">Hold Command or Control to select multiple tags.</p>
  {% endif %}

  <div class="form-actions">
    <button type="submit" class="save">Create content</button>
  </div>
</form>
{% endblock %}
