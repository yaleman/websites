<div class="editor-modal fixed inset-0 z-50 flex items-center justify-center" data-asset-modal hidden aria-hidden="true">
    <div class="editor-modal__backdrop absolute inset-0 bg-slate-950/60 backdrop-blur-sm" data-asset-modal-close></div>
    <div class="editor-modal__dialog relative flex w-[min(960px,92vw)] max-h-[90vh] flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl shadow-slate-950/20" role="dialog" aria-modal="true" aria-labelledby="asset-modal-title">
        <header class="editor-modal__header flex items-center justify-between gap-3 border-b border-slate-200 bg-slate-50 px-4 py-3">
            <h2 id="asset-modal-title">Insert image</h2>
            <div class="flex items-center gap-2">
                <a
                    href="/admin/site/{{ site_id }}/assets/new"
                    class="editor-button"
                    target="_blank"
                    rel="noopener noreferrer"
                >Upload image</a>
                <button type="button" class="editor-button" data-asset-modal-close>Close</button>
            </div>
        </header>
        <div class="editor-modal__body grid gap-4 overflow-auto p-4">
            <div class="asset-controls grid gap-3 md:grid-cols-4">
                <div class="form-field">
                    <label for="asset_search">Search images</label>
                    <input id="asset_search" type="search" placeholder="Search by filename" data-asset-search />
                </div>
                <div class="form-field">
                    <label for="asset_type">Type</label>
                    <select id="asset_type" data-asset-type>
                        <option value="all">All images</option>
                        <option value="jpeg">JPEG</option>
                        <option value="png">PNG</option>
                        <option value="gif">GIF</option>
                        <option value="svg">SVG</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="asset_sort_by">Sort by</label>
                    <select id="asset_sort_by" data-asset-sort-by>
                        <option value="uploaded">Date uploaded</option>
                        <option value="size">File size</option>
                        <option value="name">File name</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="asset_sort_dir">Direction</label>
                    <select id="asset_sort_dir" data-asset-sort-dir>
                        <option value="desc">Descending</option>
                        <option value="asc">Ascending</option>
                    </select>
                </div>
            </div>

            <div class="asset-selection">
                <p class="asset-selection__summary" data-asset-selection-summary>No images selected.</p>
                <p class="asset-selection__hint" data-asset-selection-hint>
                    Shared alt text applies to a single selected image or an external image URL.
                </p>
            </div>

            <section class="asset-section grid gap-2" data-asset-recent-section>
                <h3>Recent uploads</h3>
                <div class="asset-grid grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-4" data-asset-recent></div>
            </section>

            <section class="asset-section grid gap-2" data-asset-results-section hidden>
                <h3>Search results</h3>
                <div class="asset-grid grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-4" data-asset-results></div>
            </section>

            <div class="asset-fields grid gap-3">
                <div class="form-field">
                    <label for="asset_alt">Alt text</label>
                    <input id="asset_alt" type="text" placeholder="Describe the image" data-asset-alt />
                    <p class="asset-field-help" data-asset-alt-help>
                        Used for a single selected image or an external image URL.
                    </p>
                </div>
                {% if allow_external_image %}
                <div class="form-field">
                    <label for="asset_external">External image URL</label>
                    <input id="asset_external" type="url" placeholder="https://example.com/image.png" data-asset-external />
                </div>
                {% endif %}
            </div>
        </div>
        <footer class="editor-modal__footer flex items-center justify-end gap-2 border-t border-slate-200 bg-slate-50 px-4 py-3">
            <button type="button" class="editor-button" data-asset-modal-close>Cancel</button>
            <button type="button" class="editor-button save" data-asset-insert disabled>Insert image</button>
        </footer>
    </div>
</div>
