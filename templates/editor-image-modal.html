<div class="editor-modal" data-asset-modal hidden aria-hidden="true">
    <div class="editor-modal__backdrop" data-asset-modal-close></div>
    <div class="editor-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="asset-modal-title">
        <header class="editor-modal__header">
            <h2 id="asset-modal-title">Insert image</h2>
            <button type="button" class="editor-button" data-asset-modal-close>Close</button>
        </header>
        <div class="editor-modal__body">
            <div class="asset-controls">
                <div class="form-field">
                    <label for="asset_search">Search images</label>
                    <input id="asset_search" type="search" placeholder="Search by filename" data-asset-search />
                </div>
                <div class="form-field">
                    <label for="asset_type">Type</label>
                    <select id="asset_type" data-asset-type>
                        <option value="all">All images</option>
                        <option value="jpeg">JPEG</option>
                        <option value="png">PNG</option>
                        <option value="gif">GIF</option>
                        <option value="svg">SVG</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>
            </div>

            <section class="asset-section" data-asset-recent-section>
                <h3>Recent uploads</h3>
                <div class="asset-grid" data-asset-recent></div>
            </section>

            <section class="asset-section" data-asset-results-section hidden>
                <h3>Search results</h3>
                <div class="asset-grid" data-asset-results></div>
            </section>

            <div class="asset-fields">
                <div class="form-field">
                    <label for="asset_alt">Alt text</label>
                    <input id="asset_alt" type="text" placeholder="Describe the image" data-asset-alt />
                </div>
                {% if allow_external_image %}
                <div class="form-field">
                    <label for="asset_external">External image URL</label>
                    <input id="asset_external" type="url" placeholder="https://example.com/image.png" data-asset-external />
                </div>
                {% endif %}
            </div>
        </div>
        <footer class="editor-modal__footer">
            <button type="button" class="editor-button" data-asset-modal-close>Cancel</button>
            <button type="button" class="editor-button save" data-asset-insert disabled>Insert image</button>
        </footer>
    </div>
</div>
