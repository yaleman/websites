 <div class="form-field">
    <label for="tags">Tags</label>
    <div class="tag-editor grid gap-2" data-tag-editor>
        <input type="hidden" name="tag_list" value data-tag-list />
        <div class="tag-editor__chips flex min-h-11 flex-wrap gap-2 rounded-md border border-slate-300 bg-slate-50 p-2" data-tag-chips>
            {% for tag in tags %}
            {% if tag.selected %}
            <button type="button" class="tag-chip inline-flex items-center gap-2 rounded-md border border-slate-300 bg-white px-2.5 py-1 text-sm font-medium text-slate-700 shadow-sm" data-tag-chip="{{ tag.name }}">
                <span>{{ tag.name }}</span>
                <span class="tag-chip__remove text-xs font-semibold text-slate-400" aria-hidden="true">x</span>
            </button>
            {% endif %}
            {% endfor %}
        </div>
        <input
            id="tags"
            type="text"
            list="tag-suggestions"
            placeholder="Type to autocomplete existing tags. Press Enter or comma to add a tag."
            data-tag-input
            autocomplete="off" />
        <datalist id="tag-suggestions">
            {% for tag in tags %}
            <option value="{{ tag.name }}"></option>
            {% endfor %}
        </datalist>
    </div>
</div>
