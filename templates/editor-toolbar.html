<div class="editor-toolbar flex flex-wrap gap-2 rounded-t-xl border border-b-0 border-slate-200 bg-slate-50 p-2" data-editor-toolbar>
    <div class="editor-toolbar__group flex gap-2 border-r border-slate-200 pr-2 last:border-r-0 last:pr-0">
        <button type="button" class="editor-button" data-command="bold" aria-pressed="false">Bold</button>
        <button type="button" class="editor-button" data-command="italic" aria-pressed="false">Italic</button>
        <button type="button" class="editor-button" data-command="code" aria-pressed="false">Code</button>
        <button type="button" class="editor-button" data-command="link" aria-pressed="false">Link</button>
        <button type="button" class="editor-button" data-command="image">Image</button>
    </div>
    <div class="editor-toolbar__group flex gap-2 border-r border-slate-200 pr-2 last:border-r-0 last:pr-0">
        <label class="editor-field" for="editor_size">
            <span class="editor-field__label">Size</span>
            <select id="editor_size" class="editor-select" data-command="size" aria-label="Size">
                <option value="normal">Normal</option>
                <option value="h1">H1</option>
                <option value="h2">H2</option>
                <option value="h3">H3</option>
                <option value="h4">H4</option>
                <option value="h5">H5</option>
                <option value="h6">H6</option>
            </select>
        </label>
    </div>
    <div class="editor-toolbar__group flex gap-2 border-r border-slate-200 pr-2 last:border-r-0 last:pr-0">
        <button type="button" class="editor-button" data-command="ul" aria-pressed="false">Bullets</button>
        <button type="button" class="editor-button" data-command="ol" aria-pressed="false">Numbered</button>
        <button type="button" class="editor-button" data-command="quote" aria-pressed="false">Quote</button>
    </div>
    <div class="editor-toolbar__group flex gap-2 border-r border-slate-200 pr-2 last:border-r-0 last:pr-0">
        <!--
        TODO make this preview actually use the site template to render the content
        <button type="button" class="editor-button" data-command="preview" aria-pressed="false">
            Preview
        </button>
        -->
        <button type="button" class="editor-button" data-command="source" aria-pressed="false">
            Markdown
        </button>
    </div>
</div>
