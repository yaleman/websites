
{% include "editor-toolbar.html" %}

<div id="editor" class="editor-shell"></div>
<section class="editor-source-panel" data-editor-source-panel hidden>
    <div class="editor-source-panel__header">
        <h2>Markdown source</h2>
    </div>
    <textarea id="page_content" name="page_content" rows="14" class="editor-source">{{ page_content }}</textarea>
</section>
<section class="editor-preview" data-editor-preview hidden>
    <div class="editor-preview__header">
        <h2>Preview</h2>
    </div>
    <div class="editor-preview__body" data-editor-preview-body></div>
</section>
