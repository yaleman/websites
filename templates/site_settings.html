{% extends "base_template.html" %}
{% block body %}
<section class="content-editor__meta">
  <div class="meta-card">
    <span class="meta-label">Site ID</span>
    <span class="meta-value">{{ site_id }}</span>
  </div>
  <div class="meta-card">
    <span class="meta-label">Short Name</span>
    <span class="meta-value">{{ site_short_name }}</span>
  </div>
</section>

<form method="post" action class="editor-form">
  <div class="form-grid">
    <div class="form-field">
      <label for="full_title">Full Title</label>
      <input id="full_title" name="full_title" value="{{ full_title }}" required />
    </div>
    <div class="form-field">
      <label for="template_name">Template Name</label>
      <input id="template_name" name="template_name" value="{{ template_name }}" required />
    </div>
  </div>

  <div class="form-actions">
    <button type="submit">Save settings</button>
  </div>
</form>
{% endblock %}
