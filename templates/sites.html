{% extends "base_template.html" %}
{% block body %}
{% if !sites.is_empty() %}
<table>
  <thead>
    <tr>
      <th>Site</th>
      <th>Short Name</th>
    </tr>
  </thead>
  <tbody>
    {% for site in sites %}
    <tr>
      <td><a href="{{ site.content_href }}">{{ site.full_title }}</a></td>
      <td><a href="{{ site.content_href }}">{{ site.short_name }}</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}
{% endblock %}
